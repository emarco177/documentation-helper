[project]
name = "documentation-helper"
version = "0.1.0"
description = "A documentation assistant over the LangChain docs: ingestion with Tavily, retrieval agent, Streamlit UI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.11.20",
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.8.5",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
